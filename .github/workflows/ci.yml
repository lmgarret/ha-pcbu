name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: "0.12.19"
    - name: Lint
      run: uvx ruff@0.16.9 check --output-format=github
    - name: Check formatting
      run: uvx ruff@0.16.9 format --check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: "0.12.19"
        python-version: "3.14"
        activate-environment: true
    - name: Install the test and integration requirements
      run: |
        uv pip install -r requirements.test.txt
        jq -r '.requirements[]' custom_components/pcbu/manifest.json | xargs -d '\n' uv pip install
    - name: Run the tests
      run: pytest

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
    - name: Checkout the repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Validate the integration with hassfest
      uses: home-assistant/actions/hassfest@58bff37c8947f690ace498be413a9b78d6f30f93 # master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
    - name: Validate the repository for HACS
      uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
      with:
        category: integration
        comment: "false"
        # add GitHub topics and a brands entry to enable these checks
        ignore: brands topics
