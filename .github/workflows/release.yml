name: Release

on:
  push:
    branches:
    - main
  workflow_dispatch:

jobs:
  version-check:
    name: New version?
    runs-on: ubuntu-latest

    outputs:
      is_new_version: ${{ steps.manifest-version.outputs.is_new_version }}
      version: ${{ steps.manifest-version.outputs.version }}
    steps:
    - name: Checkout the repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # fetch tags
    - name: Check whether this version was already released
      id: manifest-version
      run: |
        version=$(jq -r .version custom_components/pcbu/manifest.json)
        echo "version=$version" >> "$GITHUB_OUTPUT"
        if git rev-parse -q --verify "refs/tags/$version" > /dev/null; then
          echo "Version $version is already released"
          echo "is_new_version=false" >> "$GITHUB_OUTPUT"
        else
          echo "Version $version is new"
          echo "is_new_version=true" >> "$GITHUB_OUTPUT"
        fi

  ci:
    name: CI
    needs: version-check
    if: needs.version-check.outputs.is_new_version == 'true'
    uses: ./.github/workflows/ci.yml

  github-release:
    name: GitHub release
    needs:
    - version-check
    - ci
    runs-on: ubuntu-latest

    permissions:
      contents: write  # IMPORTANT: mandatory for making GitHub Releases

    steps:
    - name: Checkout the repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Extract the version's changelog entry
      env:
        VERSION: ${{ needs.version-check.outputs.version }}
      run: |
        awk -v header="## [$VERSION]" '
          /^## \[/ { in_section = (index($0, header) == 1); next }
          /^\[.*\]: / { next }
          in_section
        ' CHANGELOG.md > release-notes.md
        cat release-notes.md
    - name: Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        tag_name: ${{ needs.version-check.outputs.version }}
        body_path: release-notes.md
